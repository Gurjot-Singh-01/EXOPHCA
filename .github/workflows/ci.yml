name: CI

on:
  push:
  pull_request:

# The workflow only ever reads the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the project with pinned dependencies
        run: python -m pip install -e . -c constraints.txt
      - name: Install the lint and coverage tools
        run: python -m pip install "ruff==0.17.5" coverage
      - name: Check the environment
        run: python -m pip check
      - name: Lint (the same rule set and exclusion as the pre-commit hook)
        run: >
          python -m ruff check --no-cache
          --select E9,F63,F7,F82,F401,F841
          --exclude data/reference
          .
      - name: Byte-compile the package, the app and the scripts
        run: python -m compileall -q exophca app scripts
      - name: Run the test suite under coverage
        run: python -m coverage run -m unittest discover -s tests -v
      - name: Report the coverage figure
        # Reported, not gated: the number is recorded in CONTRIBUTING.md.
        run: python -m coverage report
