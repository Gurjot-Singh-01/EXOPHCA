name: CI

on:
  push:
  pull_request:

# The workflow only ever reads the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the project with pinned dependencies
        run: python -m pip install -e . -c constraints.txt
      - name: Check the environment
        run: python -m pip check
      - name: Byte-compile the package, the app and the scripts
        run: python -m compileall -q exophca app scripts
      - name: Run the test suite
        run: python -m unittest discover -s tests -v
