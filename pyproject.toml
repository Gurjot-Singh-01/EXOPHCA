[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "exophca"
version = "1.0.0"
description = "Exoplanet Habitability Compatibility Analysis"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scipy>=1.17.1",
    "scikit-learn>=1.9.1",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
    "joblib>=1.6.0",
    "streamlit>=1.66.0",
    "plotly==7.1.0",
    "lightgbm==4.7.0",
]

[tool.setuptools.packages.find]
include = ["exophca*"]
